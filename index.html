<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CollabCode - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body class="auth-body">
    <div class="auth-screen" id="authScreen">
        <div class="auth-bg-glow"></div>
        <div class="auth-container">
            <div class="auth-header">
                <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="8" fill="url(#authGrad)" />
                    <path d="M16 8L21 13L16 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M11 14L16 19L11 24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="authGrad" x1="0" y1="0" x2="32" y2="32">
                            <stop offset="0%" stop-color="#667eea" />
                            <stop offset="100%" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                </svg>
                <h1>CollabCode</h1>
                <p>IDE Colaborativo en Tiempo Real</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Iniciar Sesión</button>
                <button class="auth-tab" data-tab="register">Registrarse</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
                </div>
                <div class="auth-error" id="loginError" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Iniciar Sesión</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="registerUsername">Nombre de usuario</label>
                    <input type="text" id="registerUsername" placeholder="Ej: DevMaster" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Contraseña</label>
                    <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                </div>
                <div class="auth-error" id="registerError" style="display:none;"></div>
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="firebase-config.js"></script>
    <script>
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        // If already logged in, redirect to projects
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = 'projects.html';
            }
        });

        // Auth Tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                e.target.classList.add('active');
                const formId = e.target.dataset.tab === 'login' ? 'loginForm' : 'registerForm';
                document.getElementById(formId).classList.add('active');
            });
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            errEl.style.display = 'none';

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // onAuthStateChanged will redirect
            } catch (error) {
                errEl.textContent = translateFirebaseError(error.code);
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const errEl = document.getElementById('registerError');
            btn.disabled = true;
            btn.textContent = 'Creando cuenta...';
            errEl.style.display = 'none';

            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            if (password.length < 6) {
                errEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Crear Cuenta';
                return;
            }

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                await db.ref(`users/${cred.user.uid}`).set({
                    username: username,
                    email: email,
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
                // onAuthStateChanged will redirect
            } catch (error) {
                errEl.textContent = translateFirebaseError(error.code);
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Crear Cuenta';
            }
        });

        function translateFirebaseError(code) {
            const map = {
                'auth/user-not-found': 'No existe una cuenta con ese email.',
                'auth/wrong-password': 'Contraseña incorrecta.',
                'auth/email-already-in-use': 'Ya existe una cuenta con ese email.',
                'auth/invalid-email': 'El email no es válido.',
                'auth/weak-password': 'La contraseña es demasiado débil.',
                'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
                'auth/invalid-credential': 'Credenciales incorrectas. Revisa tu email y contraseña.',
            };
            return map[code] || 'Error al autenticar. Inténtalo de nuevo.';
        }
    </script>
</body>

</html>
